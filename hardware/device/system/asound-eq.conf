# Wie asound.conf, aber mit EQ: alles läuft in den Loopback, CamillaDSP filtert und spielt auf der DigiAMP+.
# Sleep sounds und Musik (squeezelite, AirPlay, Spotify) laufen gleichzeitig (dmix) und werden zu Mono gemischt.
pcm.!default {
    type plug
    slave.pcm "mono"
}
pcm.mono {
    type route
    slave.pcm "mix"
    slave.channels 2
    ttable.0.0 0.5
    ttable.1.0 0.5
    ttable.0.1 0.5
    ttable.1.1 0.5
}
pcm.mix {
    type dmix
    ipc_key 4711
    ipc_perm 0666
    slave {
        pcm "hw:Loopback,0,0"
        rate 48000
        channels 2
        format S32_LE
        period_size 1024
        buffer_size 8192
    }
}
ctl.!default {
    type hw
    card 0
}
