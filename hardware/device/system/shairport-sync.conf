// AirPlay 2 receiver for the Soundlampe. Plays into the shared ALSA "default"
// device (dmix), so AirPlay, Spotify, Music Assistant and the sleep sounds mix.
// The AirPlay volume slider is a software volume; the knob sets the amp
// ("Digital" mixer) and therefore stays the master for everything.
general = {
  name = "Soundlampe";
  output_backend = "alsa";
  interpolation = "soxr";
  volume_range_db = 40;
};
alsa = {
  output_device = "default";
  output_rate = 48000;
};
