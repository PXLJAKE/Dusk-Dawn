<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Soundlampe Montageanleitung</title>
<style>
@page { size: A4; margin: 0; }
:root { --cream:#f5efe4; --paper:#fbf8f2; --navy:#232a40; --navy2:#3a4361; --brass:#b88a3e; --ink:#2b2b2b; --muted:#6b6658; --line:#ddd3bf; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family: Inter, sans-serif; color:var(--ink); font-size:9.6pt; line-height:1.48; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.page { width:210mm; height:297mm; position:relative; overflow:hidden; background:#fff; page-break-after:always; padding:16mm 16mm 18mm; }
.page:last-child { page-break-after:auto; }
h1,h2,h3 { font-family:"Bitstream Charter", Georgia, serif; color:var(--navy); font-weight:700; }
h2 { font-size:21pt; margin:1mm 0 3mm; }
h3 { font-size:12.5pt; margin:5mm 0 1.5mm; }
p { margin-bottom:2mm; }
.eyebrow { font-size:8pt; letter-spacing:.2em; text-transform:uppercase; color:var(--brass); font-weight:600; }
.lead { font-size:10.5pt; color:var(--navy2); max-width:165mm; }
table { width:100%; border-collapse:collapse; margin:2mm 0 3mm; font-size:8.8pt; }
th { text-align:left; font-weight:600; color:var(--navy); border-bottom:.4mm solid var(--navy); padding:1.4mm 1.5mm; }
td { border-bottom:.2mm solid var(--line); padding:1.3mm 1.5mm; vertical-align:top; }
td b { color:var(--navy); }
ul, ol { margin:1mm 0 3mm 5mm; }
li { margin-bottom:1.2mm; }
.note { background:var(--cream); border-left:1.2mm solid var(--brass); padding:2.5mm 4mm; margin:3mm 0; font-size:9.2pt; }
.warn { background:#fdecea; border-left:1.2mm solid #d1352b; padding:2.5mm 4mm; margin:3mm 0; font-size:9.2pt; }
.fig { text-align:center; margin:2mm 0; }
.fig img { max-width:100%; }
.cap { font-size:8pt; color:var(--muted); text-align:center; margin-top:1mm; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:7mm; }
.two-l { display:grid; grid-template-columns:72mm 1fr; gap:7mm; align-items:start; }
.foot { position:absolute; bottom:8mm; left:16mm; right:16mm; display:flex; justify-content:space-between; font-size:7.5pt; color:#9a947f; border-top:.2mm solid var(--line); padding-top:2mm; }
.steps { counter-reset:s; list-style:none; margin-left:0; }
.steps li { counter-increment:s; position:relative; padding-left:10mm; margin-bottom:2.6mm; }
.steps li::before { content:counter(s); position:absolute; left:0; top:-.3mm; width:6.5mm; height:6.5mm; border-radius:50%; background:var(--navy); color:var(--cream); font-weight:700; font-size:8.5pt; display:flex; align-items:center; justify-content:center; }
.check { color:#2e7d32; font-weight:700; }
/* cover */
.cover { background:var(--navy); color:var(--cream); padding:0; }
.cover .top { padding:22mm 18mm 0; }
.cover h1 { color:var(--cream); font-size:44pt; line-height:1; margin:4mm 0 4mm; }
.cover .sub { font-size:13pt; color:#dcd6c9; max-width:120mm; }
.cover .eyebrow { color:#d9b46c; }
.cover .imgs { position:absolute; bottom:0; right:8mm; display:flex; align-items:flex-end; gap:0; }
.cover .imgs img { height:150mm; filter:drop-shadow(0 4mm 6mm rgba(0,0,0,.35)); }
.toc { margin-top:12mm; font-size:10pt; color:#dcd6c9; line-height:1.9; }
.toc b { color:#d9b46c; display:inline-block; width:9mm; }

.chip{display:inline-flex;align-items:center;gap:2mm;border:.3mm solid var(--line);border-radius:2mm;padding:1.2mm 2.2mm;margin:0 1.5mm 1.5mm 0;background:#fff;font-size:8.6pt}
.chip b{font-size:11pt;color:var(--navy)}
.need{background:var(--cream);border-radius:3mm;padding:2.5mm 3mm;margin:2mm 0 3mm}
.need .t{font-size:7.5pt;letter-spacing:.15em;text-transform:uppercase;color:var(--brass);font-weight:600;margin-bottom:1.5mm}
.need .parts{font-size:8.8pt;margin-bottom:1.5mm}
.need .parts code{background:#fff;border:.2mm solid var(--line);border-radius:1mm;padding:.2mm 1mm;font-size:8pt}
.step{display:grid;grid-template-columns:78mm 1fr;gap:6mm;align-items:start;margin-bottom:6mm;padding-bottom:5mm;border-bottom:.3mm dashed var(--line)}
.step:last-of-type{border-bottom:none}
.step .pic{background:#f8f8f8;border-radius:3mm;display:flex;align-items:center;justify-content:center;height:105mm;position:relative}
.step .pic img{max-height:100mm;max-width:74mm}
.step .num{position:absolute;top:2mm;left:3mm;font-family:"Bitstream Charter",Georgia,serif;font-size:30pt;font-weight:700;color:var(--navy)}
.step h3{margin-top:0}
.cyl{border-left:1.2mm solid var(--navy2);background:#eef0f6;padding:2mm 3mm;margin-top:2mm;font-size:8.8pt}
.scale{font-size:7.5pt;color:var(--muted)}
</style></head><body>
