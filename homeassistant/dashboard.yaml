# Dashboard view for the Soundlampe.
# Dashboard → ⋮ → Edit → ⋮ → Raw configuration editor, then paste as a new view under `views:`
title: Soundlampe
path: soundlampe
icon: mdi:lamp
type: sections
max_columns: 2
sections:
  - type: grid
    cards:
      - type: heading
        heading: Sounds
        icon: mdi:sleep
      - type: tile
        entity: switch.sleepgen_sound
        name: Sounds
        vertical: false
        features_position: bottom
      - type: tile
        entity: select.sleepgen_preset
        features:
          - type: select-options
      - type: tile
        entity: select.sleepgen_timer
        features:
          - type: select-options
      - type: tile
        entity: sensor.sleepgen_timer_remaining
      - type: entities
        title: Mischen
        show_header_toggle: false
        entities:
          - number.sleepgen_master
          - number.sleepgen_layer_rain
          - number.sleepgen_layer_thunder
          - number.sleepgen_layer_waves
          - number.sleepgen_layer_wind
          - number.sleepgen_layer_fire
          - number.sleepgen_layer_birds
          - number.sleepgen_layer_leaves
          - number.sleepgen_layer_stream
          - number.sleepgen_layer_fan
          - number.sleepgen_layer_white
          - number.sleepgen_layer_pink
          - number.sleepgen_layer_brown
  - type: grid
    cards:
      - type: heading
        heading: Lampe & Wecker
        icon: mdi:lamp
      - type: tile
        entity: light.sleepgen_lamp
        features:
          - type: light-brightness
          - type: light-color-temp
      - type: tile
        entity: switch.sleepgen_lamp_follows_timer
      - type: tile
        entity: script.sleepgen_gute_nacht
        name: Gute Nacht
        tap_action: {action: perform-action, perform_action: script.sleepgen_gute_nacht}
      - type: tile
        entity: script.sleepgen_alles_aus
        name: Alles aus
        tap_action: {action: perform-action, perform_action: script.sleepgen_alles_aus}
      - type: entities
        title: Wecker
        show_header_toggle: false
        entities:
          - input_boolean.sleepgen_wecker_klingeln
          - input_datetime.sleepgen_wecker
          - switch.sleepgen_alarm
          - select.sleepgen_alarm_tone
          - number.sleepgen_alarm_minutes
          - number.sleepgen_alarm_volume
      - type: entities
        title: Aufwachlicht
        show_header_toggle: false
        entities:
          - input_boolean.sleepgen_wecker_aktiv
          - input_datetime.sleepgen_wecker
          - number.sleepgen_sunrise_minutes
          - sensor.soundlampe_sonnenaufgang_startet_um
          - input_boolean.sleepgen_wecker_werktags
          - input_boolean.sleepgen_wecker_voegel
          - button.sleepgen_sunrise
      - type: entities
        title: Gute Nacht
        show_header_toggle: false
        entities:
          - input_select.sleepgen_gute_nacht_preset
          - input_select.sleepgen_gute_nacht_timer
          - number.sleepgen_device_volume
      - type: entities
        title: Automatisch per Präsenzmelder
        show_header_toggle: false
        entities:
          - input_boolean.sleepgen_praesenz_auto
          - input_datetime.sleepgen_praesenz_ab
          - input_datetime.sleepgen_praesenz_bis
          - binary_sensor.schlafzimmer_praesenz
  - type: grid
    cards:
      - type: heading
        heading: Musik
        icon: mdi:music
      - type: media-control
        entity: media_player.soundlampe
