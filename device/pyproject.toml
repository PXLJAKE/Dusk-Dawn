[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepgen"
version = "0.1.0"
description = "Sleep sound mixer, lamp and wake-up light for Raspberry Pi with Home Assistant (MQTT)"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "pyyaml", "paho-mqtt>=2.0", "sounddevice"]

[project.optional-dependencies]
pi = ["gpiozero", "lgpio", "spidev"]
dev = ["pytest"]

[project.scripts]
sleepgen = "sleepgen.__main__:main"

[tool.setuptools]
packages = ["sleepgen"]
