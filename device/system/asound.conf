# Sleep sounds and music (squeezelite / Music Assistant) play at the same time (dmix).
# The lamp has one full-range driver on the DigiAMP+ left channel, so stereo is
# folded down to mono: both channels carry (L+R)/2.
pcm.!default {
    type plug
    slave.pcm "mono"
}
pcm.mono {
    type route
    slave.pcm "mix"
    slave.channels 2
    ttable.0.0 0.5
    ttable.1.0 0.5
    ttable.0.1 0.5
    ttable.1.1 0.5
}
pcm.mix {
    type dmix
    ipc_key 4711
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}
ctl.!default {
    type hw
    card 0
}
